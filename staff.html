<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPE Toernooi — Personeel</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .scorein{display:flex;gap:6px;align-items:center}
  .scorein input{width:58px;text-align:center;padding:10px 4px;font-size:1.05rem}
  .scorein .btn{margin:0;padding:10px 14px;font-size:1rem}
  .checkrij{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #1e3c66;text-transform:none;color:#fff;font-size:.95rem;margin:0;cursor:pointer}
  .checkrij input{width:20px;height:20px}
  .wed.klaar{background:#14301c;border-left:4px solid var(--groen)}
  .wed.flits{animation:flits 1.5s ease}
  @keyframes flits{0%{background:#2e7d32}100%{background:#14301c}}
  .ok-tag{color:#7ee08a;font-weight:700}
  .wis{color:#ff9b9e;font-size:.72rem;cursor:pointer;text-decoration:underline}
  .voortblok{border:1px solid #1e3c66;border-radius:10px;padding:10px 14px;min-width:170px;background:#0d2445}
  @media (max-width:640px){
    .scorein{width:100%}
    .scorein input{flex:1;min-width:0;padding:12px 4px}
    .scorein .btn{flex:0 0 auto;padding:12px 16px}
  }
</style>
</head>
<body class="donker">
<header class="kop">
  <div class="logo">PRIME PADEL EVENTS · PERSONEEL</div>
  <h1 id="titel">Personeel</h1>
  <div class="sub" id="subtitel"></div>
</header>

<div class="wrap">
  <!-- Inloggen -->
  <div id="login" class="kaart verborgen">
    <h2>Inloggen met personeelscode</h2>
    <label>Code (PIN)</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••">
    <div id="loginmelding"></div>
    <button class="btn" onclick="login()">Inloggen</button>
  </div>

  <!-- App -->
  <div id="app" class="verborgen">
    <div class="tabs">
      <button data-tab="scores" class="actief">Scores</button>
      <button data-tab="standen">Standen</button>
      <button data-tab="aanmelden">Check-in</button>
    </div>

    <div id="tab-scores">
      <div id="voortgang"></div>
      <div class="kaart">
        <div class="rij">
          <div><label>Filter</label>
            <select id="filter" onchange="tekenScores()">
              <option value="open">Alleen nog in te vullen</option>
              <option value="alle">Alle wedstrijden (scores wijzigen)</option>
            </select></div>
        </div>
      </div>
      <div id="scorelijst"></div>
    </div>

    <div id="tab-standen" class="verborgen"><div id="standenlijst"><div class="kaart">Laden…</div></div></div>

    <div id="tab-aanmelden" class="verborgen">
      <div class="kaart">
        <h3>Check-in — aanwezige teams</h3>
        <p class="mini">Vink de teams af die aanwezig zijn. Een uitgevinkt team telt als <em>afwezig</em> en doet niet mee.</p>
        <div id="checkinlijst"></div>
      </div>
      <div class="kaart">
        <h3>Nieuw team toevoegen</h3>
        <label>Teamnaam</label><input id="a_naam" placeholder="bv. Jan & Piet">
        <label>Spelers (komma-gescheiden)</label><input id="a_spelers" placeholder="Jan, Piet">
        <div class="rij">
          <div><label>Divisie / niveau</label><select id="a_divisie" onchange="vulPoules()"></select></div>
          <div><label>Poule (optioneel)</label><select id="a_poule"></select></div>
        </div>
        <div id="aanmeldmelding"></div>
        <button class="btn" onclick="aanmelden()">Toevoegen</button>
      </div>
    </div>

  </div>
</div>

<footer class="vt">Personeel-modus · toegang vervalt automatisch na de dag</footer>

<script>
const slug = new URLSearchParams(location.search).get('slug')
  || location.pathname.split('/').filter(Boolean).pop();
let DATA = null;

function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function kort(s){ s=String(s??''); return s.length>9 ? s.slice(0,8)+'…' : s; }
function divNaam(id){ const d=(DATA.divisies||[]).find(x=>x.id===id); return d?d.naam:''; }
function toon(id,on){ document.getElementById(id).classList.toggle('verborgen',!on); }
function melding(el,tekst,ok){ el.innerHTML = tekst?`<div class="melding ${ok?'ok':'fout'}">${esc(tekst)}</div>`:''; }

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('actief',x===b));
  ['scores','standen','aanmelden'].forEach(t=>toon('tab-'+t,t===b.dataset.tab));
  if(b.dataset.tab==='standen') laadStanden();
});

/* --- Standen: poules + knock-outverloop (zelfde bron als de live-pagina) --- */
async function laadStanden(){
  const doel=document.getElementById('standenlijst');
  try{
    const r=await fetch('/api/live?slug='+encodeURIComponent(slug));
    if(!r.ok){ doel.innerHTML='<div class="kaart">Kon standen niet laden.</div>'; return; }
    const d=await r.json();
    doel.innerHTML=(d.divisies||[]).map(div=>`
      ${div.poules.map(p=>`<div class="kaart"><h3>${esc(div.naam)} — ${esc(p.naam)}</h3><div class="tabelwrap"><table>
        <tr><th>#</th><th>Team</th><th>G</th><th>W</th><th>GL</th><th>V</th><th>+/-</th><th>P</th></tr>
        ${p.stand.map(r=>`<tr><td>${r.positie}</td><td>${esc(r.teamNaam)}</td><td>${r.G}</td><td>${r.W}</td><td>${r.GL}</td><td>${r.V}</td><td>${r.saldo>0?'+':''}${r.saldo}</td><td class="p">${r.P}</td></tr>`).join('')}
        </table></div></div>`).join('')}
      ${(div.bracket&&div.bracket.length)?`<div class="kaart"><h3>Knock-out — ${esc(div.naam)}</h3>
        ${div.bracket.map(w=>`<div class="wed"><div>
          <div class="meta">${esc(w.label||('Ronde '+w.ronde))}</div>
          <div class="teams" ${w.voorlopig?'style="color:#8494ab;font-style:italic"':''}>${esc(w.thuis)} — ${esc(w.uit)}</div></div>
          <div class="score">${w.score?w.score.thuis+'-'+w.score.uit:''}</div></div>`).join('')}
        <p class="mini">Cursief = nog niet definitief; wordt ingevuld zodra de knock-outfase start of een ronde is gespeeld.</p></div>`:''}`).join('')
      || '<div class="kaart">Nog geen standen — genereer eerst wedstrijden.</div>';
  }catch(e){ doel.innerHTML='<div class="kaart">Fout bij laden.</div>'; }
}

async function laadData(){
  const r = await fetch('/api/staff-data?slug='+encodeURIComponent(slug));
  if(r.status===401){ toon('login',true); toon('app',false); return; }
  if(!r.ok){ document.getElementById('titel').textContent='Toernooi niet gevonden'; return; }
  DATA = await r.json();
  document.getElementById('titel').textContent = DATA.naam;
  toon('login',false); toon('app',true);
  vulDivisies(); tekenVoortgang(); tekenScores(); tekenCheckin();
  stelKnockoutVoor();
}

/* Poulefase compleet? Stel dan één keer voor om de knock-out te starten. */
const KO_GEVRAAGD = new Set();
function stelKnockoutVoor(){
  for(const d of DATA.divisies){
    if(!d.heeftKnockout || d.knockoutGestart || KO_GEVRAAGD.has(d.id)) continue;
    const p = DATA.wedstrijden.filter(w=>w.divisie===d.id && w.groep!=='ko');
    if(p.length && p.every(w=>w.status==='klaar')){
      KO_GEVRAAGD.add(d.id);
      if(confirm(`Alle poulewedstrijden van ${d.naam} zijn ingevuld! 🎾\n\nKnock-outfase van ${d.naam} nu starten?`)){
        fase(d.id, false, true);
        return; // na het starten herlaadt de pagina de data; volgende divisie komt dan vanzelf
      }
    }
  }
}

async function login(){
  const el = document.getElementById('loginmelding');
  const r = await fetch('/api/staff-login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({slug,pin:document.getElementById('pin').value})});
  const j = await r.json();
  if(r.ok){ melding(el,'',true); laadData(); } else { melding(el,j.fout||'Mislukt',false); }
}

/* --- Voortgang per niveau (met start/terugdraai-knop knock-out) --- */
function tekenVoortgang(){
  const blok = DATA.divisies.map(d=>{
    const ws = DATA.wedstrijden.filter(w=>w.divisie===d.id);
    const p = ws.filter(w=>w.groep!=='ko'), k = ws.filter(w=>w.groep==='ko');
    const pd = p.filter(w=>w.status==='klaar').length, kd = k.filter(w=>w.status==='klaar').length;
    let knop='';
    if(d.heeftKnockout){
      const compleet = pd>=p.length && p.length>0;
      knop = d.knockoutGestart
        ? `<a class="mini" style="cursor:pointer;color:#ff9b9e" onclick="fase('${d.id}',true)">knock-out terugdraaien</a>`
        : (compleet
          ? `<button class="btn" style="margin:6px 0 0;padding:8px 12px;font-size:.75rem" onclick="fase('${d.id}',false)">Start knock-out ➜</button>`
          : `<button class="btn sec" style="margin:6px 0 0;padding:8px 12px;font-size:.75rem;opacity:.5;cursor:not-allowed" disabled>Start knock-out ➜</button>
             <div class="mini" style="margin-top:4px">nog ${p.length-pd} poule-uitslag${p.length-pd===1?'':'en'} nodig</div>`);
    }
    return `<div class="voortblok">
      <div style="font-family:'Anton';margin-bottom:4px">${esc(d.naam)}</div>
      <div class="mini">Groepsfase <b style="color:var(--lime)">${pd}/${p.length}</b>
        ${d.heeftKnockout?` · Knock-out <b style="color:var(--lime)">${kd}/${k.length}</b>`:''}</div>
      ${knop}</div>`;
  }).join('');
  document.getElementById('voortgang').innerHTML =
    `<div class="kaart"><h3>Voortgang</h3><div style="display:flex;gap:10px;flex-wrap:wrap">${blok}</div></div>`;
}

/* --- Scores: gegroepeerd op tijd (per tijdblok alle banen onder elkaar) --- */
const PALET = ['#C5E506','#4fc3f7','#ff9f43','#ee5253','#26de81','#fd79a8','#a29bfe','#feca57','#00d2d3','#ff6b81'];
function baanNaam(id){ const b=(DATA.banen||[]).find(x=>x.id===id); return b?b.naam:(id||'Baan n.t.b.'); }
function pouleNaam(w){
  for(const d of DATA.divisies){ const p=(d.poules||[]).find(x=>x.id===w.groep); if(p) return p.naam; }
  return null;
}
// Elke poule (over alle niveaus heen) een eigen kleur; knock-out paars-grijs
function pouleKleur(w){
  if(w.groep==='ko') return '#a29bfe';
  let i=0;
  for(const d of DATA.divisies) for(const p of (d.poules||[])){ if(p.id===w.groep) return PALET[i%PALET.length]; i++; }
  return '#c9d3e0';
}
function wedTag(w){
  const tekst = (w.groep==='ko' ? (w.label||'Knock-out') : (pouleNaam(w)||w.groep)) + ' · ' + divNaam(w.divisie);
  return `<span style="background:${pouleKleur(w)};color:var(--navy);border-radius:4px;padding:1px 7px;font-weight:700;text-transform:none">${esc(tekst)}</span>`;
}
function tekenScores(){
  const filter = document.getElementById('filter').value;
  let ws = DATA.wedstrijden.slice();
  if(filter==='open') ws = ws.filter(w=>w.status!=='klaar' || w.id===flitsId); // net opgeslagen even laten staan
  const rij = w => {
    const klaar = w.status==='klaar';
    return `
    <div class="wed ${klaar?'klaar':''} ${w.id===flitsId?'flits':''}" ${klaar?'':`style="border-left:4px solid ${pouleKleur(w)}"`}>
      <div><div class="meta">${esc(baanNaam(w.baan))} · ${wedTag(w)}
          ${klaar?` · <span class="ok-tag">✓ opgeslagen</span> <span class="wis" onclick="wisScore('${w.id}')">wis</span>`:''}</div>
        <div class="teams" ${w.voorlopig?'style="color:#8494ab;font-style:italic"':''}>${esc(w.thuis)} — ${esc(w.uit)}</div></div>
      ${w.voorlopig
        ? '<span class="mini" style="color:#8494ab">nog te bepalen</span>'
        : `<div class="scorein">
        <input type="number" min="0" inputmode="numeric" id="s_t_${w.id}" value="${w.score?w.score.thuis:''}" placeholder="${esc(kort(w.thuis))}">
        <input type="number" min="0" inputmode="numeric" id="s_u_${w.id}" value="${w.score?w.score.uit:''}" placeholder="${esc(kort(w.uit))}">
        <button class="btn" onclick="bewaarScore('${w.id}')" title="${klaar?'Score wijzigen':'Score opslaan'}">✓</button>
      </div>`}
    </div>`;
  };
  const tijden = [...new Set(ws.filter(w=>w.tijd).map(w=>w.tijd))].sort((a,b)=>String(a).localeCompare(String(b)));
  let html='';
  for(const tijd of tijden){
    const dw = ws.filter(w=>w.tijd===tijd).sort((a,b)=>baanNaam(a.baan).localeCompare(baanNaam(b.baan),undefined,{numeric:true}));
    html += `<div class="kaart"><h3>⏱ ${esc(tijd)}</h3>${dw.map(rij).join('')}</div>`;
  }
  const rest = ws.filter(w=>!w.tijd);
  if(rest.length) html += `<div class="kaart"><h3>Nog niet ingepland</h3>${rest.map(rij).join('')}</div>`;
  document.getElementById('scorelijst').innerHTML = html || '<div class="kaart">Geen wedstrijden'+(filter==='open'?' meer in te vullen 🎉':'')+'.</div>';
}

/* --- Check-in: aanwezigheid van ingeladen teams --- */
function tekenCheckin(){
  const lijst = document.getElementById('checkinlijst');
  let html='';
  for(const d of DATA.divisies){
    const teams = (DATA.teams||[]).filter(t=>t.divisie===d.id);
    if(!teams.length) continue;
    const aanwezig = teams.filter(t=>!t.afwezig).length;
    html += `<div class="kop2c" style="font-family:'Anton';color:var(--lime);margin:10px 0 4px">${esc(d.naam)} <span class="mini">(${aanwezig}/${teams.length} aanwezig)</span></div>`
      + teams.map(t=>`<label class="checkrij">
          <input type="checkbox" ${t.afwezig?'':'checked'} onchange="toggleAanwezig('${t.id}',this.checked)"> ${esc(t.naam)}</label>`).join('');
  }
  const rest = (DATA.teams||[]).filter(t=>!DATA.divisies.some(d=>d.id===t.divisie));
  if(rest.length) html += `<div class="kop2c" style="font-family:'Anton';color:var(--lime);margin:10px 0 4px">Overig</div>`
    + rest.map(t=>`<label class="checkrij">
        <input type="checkbox" ${t.afwezig?'':'checked'} onchange="toggleAanwezig('${t.id}',this.checked)"> ${esc(t.naam)}</label>`).join('');
  lijst.innerHTML = html || '<p class="mini">Nog geen teams ingeladen. Voeg ze hieronder toe of maak ze aan in de wizard.</p>';
}
async function toggleAanwezig(teamId, aanwezig){
  await fetch('/api/aanwezig',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:DATA.id, teamId, aanwezig})});
  const t=(DATA.teams||[]).find(x=>x.id===teamId); if(t) t.afwezig=!aanwezig;
  tekenCheckin();
}

let flitsId=null;
async function bewaarScore(wid){
  const t = document.getElementById('s_t_'+wid).value;
  const u = document.getElementById('s_u_'+wid).value;
  if(t===''||u==='') return;
  const r = await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:DATA.id,wedstrijdId:wid,score:{thuis:+t,uit:+u}})});
  if(r.ok){
    flitsId=wid;
    await laadData();
    setTimeout(()=>{ flitsId=null; }, 1600);
  } else {
    const j=await r.json().catch(()=>({}));
    alert(j.fout||'Opslaan mislukt — probeer opnieuw.');
  }
}
async function wisScore(wid){
  if(!confirm('Deze score wissen? De wedstrijd staat daarna weer als "nog in te vullen".')) return;
  const r = await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:DATA.id,wedstrijdId:wid,leeg:true})});
  if(r.ok) laadData(); else alert('Wissen mislukt.');
}

/* --- Aanmelden --- */
function vulDivisies(){
  const sel = document.getElementById('a_divisie');
  sel.innerHTML = DATA.divisies.map(d=>`<option value="${d.id}">${esc(d.naam)}</option>`).join('');
  vulPoules();
}
function vulPoules(){
  const d = DATA.divisies.find(x=>x.id===document.getElementById('a_divisie').value);
  document.getElementById('a_poule').innerHTML =
    '<option value="">— geen —</option>' + (d?d.poules.map(p=>`<option value="${p.id}">${esc(p.naam)}</option>`).join(''):'');
}
async function aanmelden(){
  const el = document.getElementById('aanmeldmelding');
  const team = {
    naam: document.getElementById('a_naam').value,
    spelers: document.getElementById('a_spelers').value.split(',').map(s=>s.trim()).filter(Boolean),
    divisie: document.getElementById('a_divisie').value,
    poule: document.getElementById('a_poule').value || null,
  };
  if(!team.naam){ melding(el,'Teamnaam verplicht',false); return; }
  const r = await fetch('/api/deelnemer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:DATA.id,team})});
  const j = await r.json();
  if(r.ok){ melding(el,'Aangemeld: '+team.naam,true); document.getElementById('a_naam').value=''; document.getElementById('a_spelers').value=''; laadData(); }
  else melding(el,j.fout||'Mislukt',false);
}

/* --- Knock-outfase starten / terugdraaien --- */
async function fase(divisieId,terug,zonderVraag){
  if(!zonderVraag && !terug && !confirm('Knock-outfase starten op basis van de huidige eindstanden?')) return;
  if(terug && !confirm('Knock-out terugdraaien? De knock-out-uitslagen worden gewist, de planning blijft staan.')) return;
  const r = await fetch('/api/fase-start',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:DATA.id,divisieId,terug})});
  if(r.ok) laadData(); else { const j=await r.json(); alert(j.fout||'Mislukt'); }
}

laadData();
</script>
</body>
</html>
