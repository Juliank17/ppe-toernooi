<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPE Toernooi — TV</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* TV-modus: groot, donker, zonder interactie — voor schermen op locatie */
  html,body{ height:100%; overflow:hidden; }
  body{ display:flex; flex-direction:column; }
  .tvkop{ display:flex; align-items:center; justify-content:space-between; padding:18px 34px;
    background:linear-gradient(180deg,var(--navy-2),var(--navy)); border-bottom:4px solid var(--lime); }
  .tvkop .logo{ font-family:'Anton'; font-size:1.6rem; color:var(--lime); letter-spacing:1px; }
  .tvkop .naam{ font-family:'Anton'; font-size:2rem; }
  .tvkop .klok{ font-family:'Anton'; font-size:2rem; color:var(--lime); }
  .podium{ flex:1; position:relative; overflow:hidden; padding:26px 34px; }
  .dia{ position:absolute; inset:26px 34px; opacity:0; transition:opacity .8s; overflow:hidden; }
  .dia.aan{ opacity:1; }
  .dia h2{ font-size:2.4rem; margin-bottom:18px; }
  .dia h2 em{ font-style:normal; color:var(--lime); }
  .kolommen{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
  .paneel{ background:var(--navy-2); border:1px solid #1e3c66; border-radius:14px; padding:16px 18px; flex:1; min-width:330px; }
  .paneel h3{ color:var(--lime); font-size:1.4rem; margin-bottom:8px; }
  .paneel table{ font-size:1.15rem; }
  .paneel th,.paneel td{ border-bottom-color:#1e3c66; padding:8px 6px; }
  .paneel td.p{ font-size:1.1rem; }
  .wedgroot{ display:flex; justify-content:space-between; gap:12px; padding:10px 4px; border-bottom:1px solid #1e3c66; font-size:1.3rem; }
  .wedgroot .m{ color:var(--grijs-2); font-size:.95rem; text-transform:uppercase; }
  .wedgroot .s{ font-family:'Anton'; font-size:1.5rem; color:var(--lime); white-space:nowrap; }
  .tvvoet{ display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:12px 34px; background:var(--navy-2); border-top:1px solid #1e3c66; }
  .sponsors{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .sponsors .pilw{ background:#fff; border-radius:10px; padding:6px 14px; display:inline-flex; align-items:center; }
  .sponsors img{ height:42px; max-width:150px; object-fit:contain; }
  .sponsors .naampil{ border:1px solid var(--lime); border-radius:999px; padding:8px 18px; font-weight:700; font-size:1.05rem; }
  .qrblok{ display:flex; align-items:center; gap:12px; }
  .qrblok .mini{ text-align:right; font-size:.85rem; }
  #qr{ background:#fff; padding:6px; border-radius:8px; }
  #qr img,#qr canvas{ display:block; width:84px!important; height:84px!important; }
  .bolletjes{ display:flex; gap:8px; }
  .bolletjes b{ width:12px; height:12px; border-radius:50%; background:#2a4a78; }
  .bolletjes b.aan{ background:var(--lime); }
  .sponsordia{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:30px; }
  .sponsordia .pilw{ background:#fff; border-radius:16px; padding:18px 30px; }
  .sponsordia img{ height:110px; max-width:340px; object-fit:contain; }
  .sponsordia .naampil{ border:2px solid var(--lime); border-radius:999px; padding:18px 40px; font-family:'Anton'; font-size:2.2rem; }
</style>
</head>
<body class="donker">

<div class="tvkop">
  <div class="logo">PRIME PADEL EVENTS</div>
  <div class="naam" id="titel">Toernooi laden…</div>
  <div class="klok" id="klok"></div>
</div>

<div class="podium" id="podium"></div>

<div class="tvvoet">
  <div class="sponsors" id="voetsponsors"></div>
  <div class="bolletjes" id="bolletjes"></div>
  <div class="qrblok">
    <div class="mini">Scan voor live<br>standen &amp; schema</div>
    <div id="qr"></div>
  </div>
</div>

<script>
const slug = new URLSearchParams(location.search).get('slug')
  || location.pathname.split('/').filter(Boolean).pop();
const DIA_SECONDEN = 12;
const PALET = ['#C5E506','#4fc3f7','#ff9f43','#ee5253','#26de81','#fd79a8','#a29bfe','#feca57'];

let DATA=null, LAATSTE='', dia=0, DIAS=[];

function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const divKleur = id => { const i=(DATA.divisies||[]).findIndex(d=>d.id===id); return PALET[(i<0?0:i)%PALET.length]; };

/* Klok */
setInterval(()=>{ document.getElementById('klok').textContent =
  new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}); }, 1000);

/* ---- Dia's opbouwen ---- */
function standDia(d){
  const poules = d.poules.map(p=>`
    <div class="paneel"><h3>${esc(p.naam)}</h3><table>
      <tr><th>#</th><th>Team</th><th>G</th><th>+/-</th><th>P</th></tr>
      ${p.stand.map(r=>`<tr><td>${r.positie}</td><td>${esc(r.teamNaam)}</td><td>${r.G}</td><td>${r.saldo>0?'+':''}${r.saldo}</td><td class="p">${r.P}</td></tr>`).join('')}
    </table></div>`).join('');
  return `<h2>Standen — <em>${esc(d.naam)}</em></h2><div class="kolommen">${poules}</div>`;
}

function bracketDia(d){
  const rondes = {};
  for(const w of d.bracket){ (rondes[w.ronde]=rondes[w.ronde]||[]).push(w); }
  const kolommen = Object.keys(rondes).sort((a,b)=>a-b).map(r=>`
    <div class="paneel"><h3>${esc((rondes[r][0].label||'Ronde '+r).replace(/\s*\d+$/,''))}</h3>
      ${rondes[r].map(w=>`<div class="wedgroot">
        <span ${w.voorlopig?'style="color:#8494ab;font-style:italic"':''}>${esc(w.thuis)}<br>${esc(w.uit)}</span>
        <span class="s">${w.score?w.score.thuis+'-'+w.score.uit+(w.score.gp?'*':''):''}</span>
      </div>`).join('')}
    </div>`).join('');
  return `<h2>Knock-out — <em>${esc(d.naam)}</em></h2><div class="kolommen">${kolommen}</div>`;
}

function programmaDia(){
  const open=(DATA.schema||[]).filter(w=>!w.score);
  if(!open.length) return null;
  const tijden=[...new Set(open.map(w=>w.tijd))].sort().slice(0,2); // nu + straks
  const kolommen = tijden.map((t,i)=>`
    <div class="paneel"><h3>${i===0?'⏱ Nu / eerstvolgend':'Daarna'} — ${esc(t)}</h3>
      ${open.filter(w=>w.tijd===t).map(w=>`<div class="wedgroot">
        <span><span class="m" style="color:${divKleur(w.divisie)}">${esc(w.baan)} · ${esc(w.label||w.poule||'')}</span><br>
        ${esc(w.thuis)} — ${esc(w.uit)}</span>
      </div>`).join('')}
    </div>`).join('');
  return `<h2>Programma</h2><div class="kolommen">${kolommen}</div>`;
}

function sponsorDia(){
  const sp=DATA.sponsoren||[];
  if(!sp.length) return null;
  return `<div class="sponsordia">
    <h2>Mede mogelijk gemaakt door</h2>
    <div style="display:flex;gap:26px;flex-wrap:wrap;justify-content:center">
      ${sp.map(s=>s.logo
        ? `<span class="pilw"><img src="${esc(s.logo)}" alt="${esc(s.naam)}"></span>`
        : `<span class="naampil">${esc(s.naam)}</span>`).join('')}
    </div></div>`;
}

function bouwDias(){
  DIAS=[];
  for(const d of DATA.divisies||[]){
    if(d.poules && d.poules.length) DIAS.push(standDia(d));
    if(d.bracket && d.bracket.length && d.bracket.some(w=>!w.voorlopig||w.score)) DIAS.push(bracketDia(d));
  }
  const prog=programmaDia(); if(prog) DIAS.push(prog);
  const spons=sponsorDia(); if(spons) DIAS.push(spons);
  if(!DIAS.length) DIAS.push('<h2>Nog geen wedstrijden — het toernooi begint zo!</h2>');
}

function toonDia(){
  if(!DIAS.length) return;
  dia = dia % DIAS.length;
  document.getElementById('podium').innerHTML = `<div class="dia">${DIAS[dia]}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const d=document.querySelector('.dia'); if(d) d.classList.add('aan');
  }));
  document.getElementById('bolletjes').innerHTML = DIAS.map((_,i)=>`<b class="${i===dia?'aan':''}"></b>`).join('');
}

setInterval(()=>{ dia=(dia+1)%Math.max(1,DIAS.length); toonDia(); }, DIA_SECONDEN*1000);

/* ---- Voet: sponsors klein + QR naar de live-pagina ---- */
let qrGemaakt=false;
function tekenVoet(){
  const sp=DATA.sponsoren||[];
  document.getElementById('voetsponsors').innerHTML = sp.slice(0,6).map(s=>s.logo
    ? `<span class="pilw"><img src="${esc(s.logo)}" alt="${esc(s.naam)}"></span>`
    : `<span class="naampil">${esc(s.naam)}</span>`).join('');
  if(!qrGemaakt && window.QRCode){
    new QRCode(document.getElementById('qr'), { text: location.origin+'/live/'+slug, width:84, height:84, correctLevel: QRCode.CorrectLevel.M });
    qrGemaakt=true;
  }
}

/* ---- Data laden (alleen her-tekenen bij wijziging) ---- */
async function laden(){
  try{
    const r=await fetch('/api/live?slug='+encodeURIComponent(slug));
    if(!r.ok){ document.getElementById('titel').textContent='Toernooi niet gevonden'; return; }
    const txt=await r.text();
    if(txt===LAATSTE) return;
    LAATSTE=txt;
    DATA=JSON.parse(txt);
    document.getElementById('titel').textContent=DATA.naam;
    bouwDias(); toonDia(); tekenVoet();
  }catch(e){ /* stil — volgende poging */ }
}
laden();
setInterval(laden, 15000);
</script>
</body>
</html>
