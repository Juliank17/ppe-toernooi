<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPE Toernooi — Live</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  tr.ik td{ background:#42561a; font-weight:700; }
  .teamkaart{ border-left:6px solid var(--lime); }
  .sponsorpil{ display:inline-block; border:1px solid var(--lime); border-radius:999px; padding:5px 14px; font-weight:700; color:#fff; }
  .ster{ cursor:pointer; color:#7d8ba0; width:26px; text-align:center; font-size:1.05rem; user-select:none; }
  .ster.aan{ color:var(--lime); }
</style>
</head>
<body class="donker">
<header class="kop">
  <div class="logo">PRIME PADEL EVENTS</div>
  <h1 id="titel">Toernooi laden…</h1>
  <div class="sub" id="subtitel"></div>
</header>

<div class="wrap">
  <div class="kaart" style="padding:12px 16px">
    <div class="rij">
      <div><label>Niveau</label><select id="f_niveau" onchange="zetFilter()"><option value="alle">Alle niveaus</option></select></div>
      <div><label>Zoek je team</label><input id="f_team" list="teamlijst" placeholder="Typ je teamnaam…" oninput="zetFilter()"></div>
    </div>
    <datalist id="teamlijst"></datalist>
  </div>

  <div class="tabs">
    <button data-tab="standen" class="actief">Standen</button>
    <button data-tab="schema">Schema</button>
    <button data-tab="info">Info</button>
  </div>

  <div id="tab-standen"></div>
  <div id="tab-schema" class="verborgen"></div>
  <div id="tab-info" class="verborgen">
    <div class="kaart"><h2>Toernooi-informatie</h2><p id="infotekst" class="mini"></p></div>
  </div>

  <div id="sponsors"></div>
</div>

<footer class="vt">Live standen &amp; schema · Prime Padel Events</footer>

<script>
const slug = new URLSearchParams(location.search).get('slug')
  || location.pathname.split('/').filter(Boolean).pop();

let actief = 'standen';
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  actief = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('actief', x === b));
  ['standen','schema','info'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('verborgen', t !== actief));
});

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function standTabel(p, zoek){
  const fav = localStorage.getItem(FAV_KEY);
  const rows = p.stand.map(r => `
    <tr class="${r.gelijkstand?'tie':''} ${zoek&&String(r.teamNaam).toLowerCase().includes(zoek)?'ik':''}">
      <td class="ster ${fav===r.teamNaam?'aan':''}" data-team="${esc(r.teamNaam)}" title="Zet als mijn team">${fav===r.teamNaam?'★':'☆'}</td>
      <td>${r.positie}</td><td>${esc(r.teamNaam)}</td>
      <td>${r.G}</td><td>${r.W}</td><td>${r.GL}</td><td>${r.V}</td>
      <td class="uitgebreid">${r.DPV}</td><td class="uitgebreid">${r.DPT}</td><td>${r.saldo>0?'+':''}${r.saldo}</td>
      <td class="p">${r.P}</td></tr>`).join('');
  return `<div class="kaart"><h3>${esc(p.naam)}</h3><p class="mini" style="margin:0 0 6px">Tik op de ☆ voor je eigen team — dan zie je voortaan meteen jouw wedstrijden.</p><div class="tabelwrap"><table>
    <tr><th></th><th>#</th><th>Team</th><th>G</th><th>W</th><th>GL</th><th>V</th><th class="uitgebreid">DPV</th><th class="uitgebreid">DPT</th><th>+/-</th><th>P</th></tr>
    ${rows}</table></div></div>`;
}

function bracketBlok(d){
  if(!d.bracket || !d.bracket.length) return '';
  const rows = d.bracket.map(w => `
    <div class="wed"><div><div class="meta">${esc(w.label||('Ronde '+w.ronde))}</div>
      <div class="teams" ${w.voorlopig?'style="color:#8494ab;font-style:italic"':''}>${esc(w.thuis)} — ${esc(w.uit)}</div></div>
      <div class="score">${w.score ? w.score.thuis+'-'+w.score.uit : ''}</div></div>`).join('');
  return `<div class="kaart"><h3>Knock-out</h3>${rows}</div>`;
}

let DATA=null, fNiv='alle', fTeam='';
function zetFilter(){
  fNiv=document.getElementById('f_niveau').value;
  fTeam=document.getElementById('f_team').value;
  teken();
}

/* ---- Favoriet team (per toernooi onthouden in deze browser) ---- */
const FAV_KEY='ppe_fav_'+slug;
let LAATST_TEAM=null, favToegepast=false;
function maakFavoriet(){ if(LAATST_TEAM){ kiesFavoriet(LAATST_TEAM); } }
function wisFavoriet(){ localStorage.removeItem(FAV_KEY); teken(); }
function kiesFavoriet(naam){
  localStorage.setItem(FAV_KEY, naam);
  fTeam=naam; document.getElementById('f_team').value=naam;
  const dId=vindTeamDivisie(naam);
  if(dId){ fNiv=dId; document.getElementById('f_niveau').value=dId; }
  teken();
}
// Ster in de poulestand: één tik = favoriet aan/uit
document.getElementById('tab-standen').addEventListener('click', e=>{
  const st=e.target.closest('.ster'); if(!st) return;
  const naam=st.dataset.team;
  if(localStorage.getItem(FAV_KEY)===naam){
    wisFavoriet();
  } else {
    kiesFavoriet(naam);
  }
});

function render(data){
  DATA=data;
  vulFilters();
  // Eerste keer: favoriet team automatisch invullen zodat je meteen je eigen wedstrijden ziet
  if(!favToegepast){
    favToegepast=true;
    const fav=localStorage.getItem(FAV_KEY);
    if(fav && !fTeam){
      fTeam=fav; document.getElementById('f_team').value=fav;
      const divId=vindTeamDivisie(fav); // ook meteen het niveau-filter op jouw divisie
      if(divId){ fNiv=divId; document.getElementById('f_niveau').value=divId; }
    }
  }
  teken();
}
function vindTeamDivisie(naam){
  const nl=String(naam).toLowerCase();
  for(const d of DATA.divisies||[]) for(const p of d.poules||[]) for(const r of p.stand||[])
    if(String(r.teamNaam).toLowerCase()===nl) return d.id;
  return null;
}

function vulFilters(){
  const sel=document.getElementById('f_niveau');
  sel.innerHTML = '<option value="alle">Alle niveaus</option>' +
    (DATA.divisies||[]).map(d=>`<option value="${d.id}">${esc(d.naam)}</option>`).join('');
  sel.value = (DATA.divisies||[]).some(d=>d.id===fNiv) ? fNiv : 'alle';
  const namen=new Set();
  (DATA.divisies||[]).forEach(d=>d.poules.forEach(p=>p.stand.forEach(r=>namen.add(r.teamNaam))));
  document.getElementById('teamlijst').innerHTML=[...namen].sort().map(n=>`<option value="${esc(n)}">`).join('');
}

// Blok voor het gezochte team: positie in de poule + eigen wedstrijden (uitslagen + programma)
function teamBlok(zoek){
  if(!zoek) return '';
  let gev=null;
  for(const d of DATA.divisies||[]) for(const p of d.poules||[]) for(const r of p.stand||[])
    if(!gev && String(r.teamNaam).toLowerCase().includes(zoek)) gev={d,p,r};
  if(!gev){
    LAATST_TEAM=null;
    return '<div class="kaart"><p class="mini">Geen team gevonden met die naam.</p></div>';
  }
  const {d,p,r}=gev;
  LAATST_TEAM=r.teamNaam;
  const isFav=localStorage.getItem(FAV_KEY)===r.teamNaam;
  const nl=String(r.teamNaam).toLowerCase();
  const mijn=(DATA.schema||[]).filter(w=>String(w.thuis).toLowerCase()===nl||String(w.uit).toLowerCase()===nl);
  const rows=mijn.map(w=>`
    <div class="wed"><div><div class="meta">⏱ ${esc(w.tijd)} · ${esc(w.baan)}${w.label?' · '+esc(w.label):''}</div>
      <div class="teams">${esc(w.thuis)} — ${esc(w.uit)}</div></div>
      <div class="score">${w.score?w.score.thuis+'-'+w.score.uit:'<span class="badge">nog te spelen</span>'}</div></div>`).join('');
  return `<div class="kaart teamkaart">
    <h3>${isFav?'★ ':''}${esc(r.teamNaam)}</h3>
    <p class="mini">${esc(d.naam)} · ${esc(p.naam)} · positie <b style="color:var(--lime)">${r.positie}</b> van ${p.stand.length} · ${r.P} punten (${r.W} winst, ${r.GL} gelijk, ${r.V} verlies)</p>
    <p class="mini" style="margin:4px 0 10px">${isFav
      ? `<span style="color:var(--lime);font-weight:700">★ Jouw team</span> — wordt bij elk bezoek automatisch getoond · <a style="cursor:pointer" onclick="wisFavoriet()">niet meer volgen</a>`
      : `<a style="cursor:pointer;color:var(--lime);font-weight:700" onclick="maakFavoriet()">☆ Zet als mijn team</a> — dan zie je bij elk bezoek meteen je eigen wedstrijden en poule`}</p>
    ${rows||'<p class="mini">Nog geen wedstrijden ingepland.</p>'}
  </div>`;
}

function teken(){
  if(!DATA) return;
  document.getElementById('titel').textContent = DATA.naam;
  document.getElementById('subtitel').textContent = [DATA.datum, DATA.locatie].filter(Boolean).join(' · ');
  document.getElementById('infotekst').textContent =
    `${DATA.naam} — ${DATA.locatie||''}. Banen: ${(DATA.banen||[]).map(b=>b.naam).join(', ')||'n.t.b.'}`;

  const zoek=fTeam.trim().toLowerCase();
  const divs=(DATA.divisies||[]).filter(d=>fNiv==='alle'||d.id===fNiv);

  // Standen (per divisie, gefilterd; gezocht team uitgelicht)
  document.getElementById('tab-standen').innerHTML = teamBlok(zoek) + (divs.map(d => `
    <div class="kaart donker"><h2>${esc(d.naam)}</h2></div>
    ${d.poules.map(p=>standTabel(p,zoek)).join('')}
    ${bracketBlok(d)}`).join('') || '<div class="kaart">Nog geen standen.</div>');

  // Schema (met niveau + speeltijd, gefilterd)
  const divNaam = id => { const d=(DATA.divisies||[]).find(x=>x.id===id); return d?d.naam:''; };
  let sch=(DATA.schema||[]).filter(w=>fNiv==='alle'||w.divisie===fNiv);
  if(zoek) sch=sch.filter(w=>String(w.thuis).toLowerCase().includes(zoek)||String(w.uit).toLowerCase().includes(zoek));
  document.getElementById('tab-schema').innerHTML = sch.length
    ? `<div class="kaart">${sch.map(w => `
        <div class="wed"><div><div class="meta">⏱ ${esc(w.tijd)} · ${esc(w.baan)} · ${esc(divNaam(w.divisie))}${w.label?' · '+esc(w.label):(w.poule?' · '+esc(w.poule):'')}</div>
          <div class="teams">${esc(w.thuis)} — ${esc(w.uit)}</div></div>
          <div class="score">${w.score ? w.score.thuis+'-'+w.score.uit : '<span class="badge">nog te spelen</span>'}</div>
        </div>`).join('')}</div>`
    : '<div class="kaart">Geen wedstrijden gevonden.</div>';

  // Sponsoren (altijd zichtbaar, onder de tabs)
  const sp=DATA.sponsoren||[];
  document.getElementById('sponsors').innerHTML = sp.length
    ? `<div class="kaart" style="padding:14px 16px;text-align:center">
        <div class="mini" style="letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Mede mogelijk gemaakt door</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          ${sp.map(s=>{const pil = s.logo
              ? `<span class="sponsorpil" style="background:#fff;padding:6px 14px" title="${esc(s.naam)}"><img src="${esc(s.logo)}" alt="${esc(s.naam)}" style="height:34px;max-width:130px;object-fit:contain;vertical-align:middle"></span>`
              : `<span class="sponsorpil">${esc(s.naam)}</span>`;
            return s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" style="text-decoration:none">${pil}</a>`:pil;}).join('')}
        </div></div>`
    : '';
}

async function laden(){
  try {
    const r = await fetch('/api/live?slug=' + encodeURIComponent(slug));
    if(!r.ok){ document.getElementById('titel').textContent = 'Toernooi niet gevonden'; return; }
    render(await r.json());
  } catch(e){ /* stil: volgende poll probeert opnieuw */ }
}
laden();
setInterval(laden, 8000); // live via polling
</script>
</body>
</html>
