<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPE Toernooi — Live</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  tr.ik td{ background:#42561a; font-weight:700; }
  .teamkaart{ border-left:6px solid var(--lime); }
  .sponsorpil{ display:inline-block; border:1px solid var(--lime); border-radius:999px; padding:5px 14px; font-weight:700; color:#fff; }
  .ster{ cursor:pointer; color:#7d8ba0; width:26px; text-align:center; font-size:1.05rem; user-select:none; }
  .ster.aan{ color:var(--lime); }
  /* Roosterweergave van het schema (zoals het planbord) */
  .rooster{ border-collapse:collapse; width:100%; table-layout:fixed; min-width:720px; }
  .rooster th,.rooster td{ border:1px solid #1e3c66; padding:3px; vertical-align:top; }
  .rooster th{ background:var(--navy-2); color:#fff; font-size:.72rem; padding:6px 4px; }
  .rooster td.tijd{ background:var(--navy-2); color:var(--lime); font-family:'Anton'; font-size:.8rem; width:52px; text-align:center; border-bottom-color:#1e3c66; }
  .gchip{ background:#fff; color:var(--navy); border-radius:5px; border-left:4px solid var(--lime); padding:3px 6px; font-size:.72rem; line-height:1.2; margin-bottom:2px; }
  .gchip small{ display:block; color:#5b6b82; font-size:.58rem; text-transform:uppercase; }
  .gchip.dim{ opacity:.3; }
  .gchip.fav{ outline:2px solid var(--lime); }
</style>
</head>
<body class="donker">
<header class="kop">
  <div class="logo">PRIME PADEL EVENTS</div>
  <h1 id="titel">Toernooi laden…</h1>
  <div class="sub" id="subtitel"></div>
</header>

<div class="wrap">
  <div class="kaart" style="padding:12px 16px">
    <div class="rij">
      <div><label>Niveau</label><select id="f_niveau" onchange="zetFilter()"><option value="alle">Alle niveaus</option></select></div>
      <div><label>Zoek je team</label><input id="f_team" list="teamlijst" placeholder="Typ je teamnaam…" oninput="zetFilter()"></div>
    </div>
    <datalist id="teamlijst"></datalist>
  </div>

  <div class="tabs">
    <button data-tab="teams" class="actief">Teams</button>
    <button data-tab="standen">Standen</button>
    <button data-tab="schema">Schema</button>
    <button data-tab="info">Info</button>
  </div>

  <div id="tab-teams"></div>
  <div id="tab-standen" class="verborgen"></div>
  <div id="tab-schema" class="verborgen"></div>
  <div id="tab-info" class="verborgen">
    <div class="kaart"><h2>Toernooi-informatie</h2><p id="infotekst" class="mini"></p></div>
  </div>

  <div id="sponsors"></div>
</div>

<footer class="vt">Live standen &amp; schema · Prime Padel Events</footer>

<script>
const slug = new URLSearchParams(location.search).get('slug')
  || location.pathname.split('/').filter(Boolean).pop();

let actief = 'teams';
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  actief = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('actief', x === b));
  ['teams','standen','schema','info'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('verborgen', t !== actief));
});

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function standTabel(p, zoek){
  const fav = favId();
  const rows = p.stand.map(r => `
    <tr class="${r.gelijkstand?'tie':''} ${(fav===r.team)||(zoek&&String(r.teamNaam).toLowerCase().includes(zoek))?'ik':''}">
      <td class="ster ${fav===r.team?'aan':''}" data-teamid="${esc(r.team)}" title="Zet als mijn team">${fav===r.team?'★':'☆'}</td>
      <td>${r.positie}</td><td>${esc(r.teamNaam)}</td>
      <td>${r.G}</td><td>${r.W}</td><td>${r.GL}</td><td>${r.V}</td>
      <td class="uitgebreid">${r.DPV}</td><td class="uitgebreid">${r.DPT}</td><td>${r.saldo>0?'+':''}${r.saldo}</td>
      <td class="p">${r.P}</td></tr>`).join('');
  return `<div class="kaart"><h3>${esc(p.naam)}</h3><div class="tabelwrap"><table>
    <tr><th></th><th>#</th><th>Team</th><th>G</th><th>W</th><th>GL</th><th>V</th><th class="uitgebreid">DPV</th><th class="uitgebreid">DPT</th><th>+/-</th><th>P</th></tr>
    ${rows}</table></div></div>`;
}

function bracketBlok(d){
  if(!d.bracket || !d.bracket.length) return '';
  const rows = d.bracket.map(w => `
    <div class="wed"><div><div class="meta">${esc(w.label||('Ronde '+w.ronde))}</div>
      <div class="teams" ${w.voorlopig?'style="color:#8494ab;font-style:italic"':''}>${esc(w.thuis)} — ${esc(w.uit)}</div></div>
      <div class="score">${w.score ? w.score.thuis+'-'+w.score.uit : ''}</div></div>`).join('');
  return `<div class="kaart"><h3>Knock-out</h3>${rows}</div>`;
}

let DATA=null, fNiv='alle', fTeam='';
const PALET = ['#C5E506','#4fc3f7','#ff9f43','#ee5253','#26de81','#fd79a8','#a29bfe','#feca57'];
const divNaamVan = id => { const d=(DATA.divisies||[]).find(x=>x.id===id); return d?d.naam:''; };
const divKleur = id => { const i=(DATA.divisies||[]).findIndex(d=>d.id===id); return PALET[(i<0?0:i)%PALET.length]; };
let schemaWeergave = localStorage.getItem('ppe_schema_weergave')||'rooster';
function zetWeergave(w){ schemaWeergave=w; localStorage.setItem('ppe_schema_weergave',w); teken(); }
function zetFilter(){
  fNiv=document.getElementById('f_niveau').value;
  fTeam=document.getElementById('f_team').value;
  teken();
}

/* ---- Favoriet team (op team-id, per toernooi onthouden in deze browser) ---- */
const FAV_KEY='ppe_fav_'+slug;
let LAATST_TEAM=null, favToegepast=false; // LAATST_TEAM = team-id van het getoonde teamkaartje
const favId=()=>localStorage.getItem(FAV_KEY);
function maakFavoriet(){ if(LAATST_TEAM){ kiesFavoriet(LAATST_TEAM); } }
function wisFavoriet(){ localStorage.removeItem(FAV_KEY); teken(); }
function kiesFavoriet(id){
  localStorage.setItem(FAV_KEY, id);
  const rij=vindRijOpId(id);
  if(rij){
    fTeam=rij.r.teamNaam; document.getElementById('f_team').value=fTeam;
    fNiv=rij.d.id; document.getElementById('f_niveau').value=fNiv;
  }
  teken();
}
// Vind de standregel (divisie/poule/rij) van een team-id
function vindRijOpId(id){
  if(!id) return null;
  for(const d of DATA.divisies||[]) for(const p of d.poules||[]) for(const r of p.stand||[])
    if(r.team===id) return {d,p,r};
  return null;
}
// Ster bij een team (Teams-tab of poulestand): één tik = favoriet aan/uit
document.addEventListener('click', e=>{
  const st=e.target.closest('.ster'); if(!st) return;
  const id=st.dataset.teamid;
  if(favId()===id) wisFavoriet(); else kiesFavoriet(id);
});

function render(data){
  DATA=data;
  vulFilters();
  // Eerste keer: favoriet team automatisch invullen zodat je meteen je eigen wedstrijden ziet
  if(!favToegepast){
    favToegepast=true;
    const rij=vindRijOpId(favId());
    if(rij && !fTeam){
      fTeam=rij.r.teamNaam; document.getElementById('f_team').value=fTeam;
      fNiv=rij.d.id; document.getElementById('f_niveau').value=fNiv;
    }
  }
  teken();
}

function vulFilters(){
  const sel=document.getElementById('f_niveau');
  sel.innerHTML = '<option value="alle">Alle niveaus</option>' +
    (DATA.divisies||[]).map(d=>`<option value="${d.id}">${esc(d.naam)}</option>`).join('');
  sel.value = (DATA.divisies||[]).some(d=>d.id===fNiv) ? fNiv : 'alle';
  const namen=new Set();
  (DATA.divisies||[]).forEach(d=>d.poules.forEach(p=>p.stand.forEach(r=>namen.add(r.teamNaam))));
  document.getElementById('teamlijst').innerHTML=[...namen].sort().map(n=>`<option value="${esc(n)}">`).join('');
}

// Blok voor het gezochte/favoriete team: positie in de poule + eigen wedstrijden
function teamBlok(zoek){
  const favRij=vindRijOpId(favId());
  let gev=null;
  // Zoektekst gaat vóór, tenzij die gewoon de favoriet zelf is
  if(zoek && !(favRij && String(favRij.r.teamNaam).toLowerCase().includes(zoek))){
    for(const d of DATA.divisies||[]) for(const p of d.poules||[]) for(const r of p.stand||[])
      if(!gev && String(r.teamNaam).toLowerCase().includes(zoek)) gev={d,p,r};
    if(!gev){ LAATST_TEAM=null; return '<div class="kaart"><p class="mini">Geen team gevonden met die naam.</p></div>'; }
  } else if(zoek || favRij){
    gev=favRij || null;
    if(!gev && zoek){ LAATST_TEAM=null; return '<div class="kaart"><p class="mini">Geen team gevonden met die naam.</p></div>'; }
  }
  if(!gev){ LAATST_TEAM=null; return ''; }
  const {d,p,r}=gev;
  LAATST_TEAM=r.team; // team-id
  const isFav=favId()===r.team;
  const mijn=(DATA.schema||[]).filter(w=>w.thuisId===r.team||w.uitId===r.team);
  const rows=mijn.map(w=>`
    <div class="wed"><div><div class="meta">⏱ ${esc(w.tijd)} · ${esc(w.baan)}${w.label?' · '+esc(w.label):''}</div>
      <div class="teams">${esc(w.thuis)} — ${esc(w.uit)}</div></div>
      <div class="score">${w.score?w.score.thuis+'-'+w.score.uit:'<span class="badge">nog te spelen</span>'}</div></div>`).join('');
  return `<div class="kaart teamkaart">
    <h3>${isFav?'★ ':''}${esc(r.teamNaam)}</h3>
    <p class="mini">${esc(d.naam)} · ${esc(p.naam)} · positie <b style="color:var(--lime)">${r.positie}</b> van ${p.stand.length} · ${r.P} punten (${r.W} winst, ${r.GL} gelijk, ${r.V} verlies)</p>
    <p class="mini" style="margin:4px 0 10px">${isFav
      ? `<span style="color:var(--lime);font-weight:700">★ Jouw team</span> — wordt bij elk bezoek automatisch getoond · <a style="cursor:pointer" onclick="wisFavoriet()">niet meer volgen</a>`
      : `<a style="cursor:pointer;color:var(--lime);font-weight:700" onclick="maakFavoriet()">☆ Zet als mijn team</a> — dan zie je bij elk bezoek meteen je eigen wedstrijden en poule`}</p>
    ${rows||'<p class="mini">Nog geen wedstrijden ingepland.</p>'}
  </div>`;
}

// Roosterweergave: banen naast elkaar, tijden onder elkaar (zoals het planbord).
// Toont álle wedstrijden; bij een niveau-filter vervagen de andere niveaus,
// en het favoriete team krijgt een lime kader.
function rasterHtml(){
  const alle=DATA.schema||[];
  if(!alle.length) return '<div class="kaart">Nog geen wedstrijden ingepland.</div>';
  const banen=(DATA.banen||[]).filter(b=>alle.some(w=>w.baan===b.naam));
  const tijden=[...new Set(alle.map(w=>w.tijd))].sort((a,b)=>String(a).localeCompare(String(b)));
  const favR=vindRijOpId(favId());
  let h='<div class="kaart" style="overflow-x:auto;padding:10px"><table class="rooster"><tr><th>Tijd</th>'
    + banen.map(b=>`<th>${esc(b.naam)}</th>`).join('')+'</tr>';
  for(const t of tijden){
    h+=`<tr><td class="tijd">${esc(t)}</td>`;
    for(const b of banen){
      const ws=alle.filter(w=>w.tijd===t&&w.baan===b.naam);
      h+='<td>'+ws.map(w=>{
        const dim = fNiv!=='alle' && w.divisie!==fNiv;
        const isFav = favR && (w.thuisId===favR.r.team||w.uitId===favR.r.team);
        return `<div class="gchip ${dim?'dim':''} ${isFav?'fav':''}" style="border-left-color:${divKleur(w.divisie)}">
          <small>${esc(divNaamVan(w.divisie))}${w.label?' · '+esc(w.label):(w.poule?' · '+esc(w.poule):'')}</small>
          ${isFav?'★ ':''}${esc(w.thuis)} — ${esc(w.uit)}${w.score?` <b>${w.score.thuis}-${w.score.uit}</b>`:''}</div>`;
      }).join('')+'</td>';
    }
    h+='</tr>';
  }
  h+='</table>';
  h+=`<div class="mini" style="margin-top:8px;display:flex;gap:12px;flex-wrap:wrap">${(DATA.divisies||[]).map(d=>
    `<span><b style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${divKleur(d.id)};margin-right:4px;vertical-align:middle"></b>${esc(d.naam)}</span>`).join('')}</div>`;
  return h+'</div>';
}

function teken(){
  if(!DATA) return;
  document.getElementById('titel').textContent = DATA.naam;
  document.getElementById('subtitel').textContent = [DATA.datum, DATA.locatie].filter(Boolean).join(' · ');
  document.getElementById('infotekst').textContent =
    `${DATA.naam} — ${DATA.locatie||''}. Banen: ${(DATA.banen||[]).map(b=>b.naam).join(', ')||'n.t.b.'}`;

  const zoek=fTeam.trim().toLowerCase();
  const divs=(DATA.divisies||[]).filter(d=>fNiv==='alle'||d.id===fNiv);

  // Teams-tab: alle teams met een ster erachter (zoekveld bovenaan filtert mee)
  const fav=favId();
  let alleTeams=[];
  for(const d of DATA.divisies||[]) for(const p of d.poules||[]) for(const r of p.stand||[])
    alleTeams.push({id:r.team, naam:r.teamNaam, div:d.naam, poule:p.naam});
  if(zoek) alleTeams=alleTeams.filter(t=>t.naam.toLowerCase().includes(zoek));
  alleTeams.sort((a,b)=>a.naam.localeCompare(b.naam));
  document.getElementById('tab-teams').innerHTML = `<div class="kaart">
    <h2>Teams</h2>
    <p class="mini">Tik op de ster achter jouw team — dan zie je bij elk bezoek meteen je eigen wedstrijden, poule en stand.</p>
    ${alleTeams.map(t=>`
      <div class="wed"><div>
        <div class="teams">${fav===t.id?'★ ':''}${esc(t.naam)}</div>
        <div class="meta">${esc(t.div)} · ${esc(t.poule)}</div></div>
        <div class="ster ${fav===t.id?'aan':''}" data-teamid="${esc(t.id)}" style="font-size:1.6rem">${fav===t.id?'★':'☆'}</div>
      </div>`).join('') || '<p class="mini">Geen teams gevonden.</p>'}
  </div>` + teamBlok(zoek);

  // Standen (per divisie, gefilterd; gezocht team uitgelicht)
  document.getElementById('tab-standen').innerHTML = teamBlok(zoek) + (divs.map(d => `
    <div class="kaart donker"><h2>${esc(d.naam)}</h2></div>
    ${d.poules.map(p=>standTabel(p,zoek)).join('')}
    ${bracketBlok(d)}`).join('') || '<div class="kaart">Nog geen standen.</div>');

  // Schema: lijst óf rooster (zoals het planbord), alleen gefilterd op niveau.
  // De teamzoeker werkt bewust níét op het schema — eigen wedstrijden staan
  // al in het teamkaartje (tab Teams) en het favoriete team licht op in het rooster.
  const sch=(DATA.schema||[]).filter(w=>fNiv==='alle'||w.divisie===fNiv);
  const lijstHtml = sch.length
    ? `<div class="kaart">${sch.map(w => `
        <div class="wed"><div><div class="meta">⏱ ${esc(w.tijd)} · ${esc(w.baan)} · ${esc(divNaamVan(w.divisie))}${w.label?' · '+esc(w.label):(w.poule?' · '+esc(w.poule):'')}</div>
          <div class="teams">${esc(w.thuis)} — ${esc(w.uit)}</div></div>
          <div class="score">${w.score ? w.score.thuis+'-'+w.score.uit : '<span class="badge">nog te spelen</span>'}</div>
        </div>`).join('')}</div>`
    : '<div class="kaart">Geen wedstrijden gevonden.</div>';
  const toggleHtml = `<div class="kaart" style="padding:10px 16px;display:flex;gap:8px;align-items:center">
    <button class="btn ${schemaWeergave==='rooster'?'':'sec'}" style="margin:0;padding:8px 14px" onclick="zetWeergave('rooster')">Rooster</button>
    <button class="btn ${schemaWeergave==='lijst'?'':'sec'}" style="margin:0;padding:8px 14px" onclick="zetWeergave('lijst')">Lijst</button>
    ${schemaWeergave==='rooster'&&fNiv!=='alle'?`<span class="mini">Jouw niveau licht op; de rest is vervaagd.</span>`:''}
  </div>`;
  document.getElementById('tab-schema').innerHTML = toggleHtml + (schemaWeergave==='rooster' ? rasterHtml() : lijstHtml);

  // Sponsoren (altijd zichtbaar, onder de tabs)
  const sp=DATA.sponsoren||[];
  document.getElementById('sponsors').innerHTML = sp.length
    ? `<div class="kaart" style="padding:14px 16px;text-align:center">
        <div class="mini" style="letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Mede mogelijk gemaakt door</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          ${sp.map(s=>{const pil = s.logo
              ? `<span class="sponsorpil" style="background:#fff;padding:6px 14px" title="${esc(s.naam)}"><img src="${esc(s.logo)}" alt="${esc(s.naam)}" style="height:34px;max-width:130px;object-fit:contain;vertical-align:middle"></span>`
              : `<span class="sponsorpil">${esc(s.naam)}</span>`;
            return s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" style="text-decoration:none">${pil}</a>`:pil;}).join('')}
        </div></div>`
    : '';
}

async function laden(){
  try {
    const r = await fetch('/api/live?slug=' + encodeURIComponent(slug));
    if(!r.ok){ document.getElementById('titel').textContent = 'Toernooi niet gevonden'; return; }
    render(await r.json());
  } catch(e){ /* stil: volgende poll probeert opnieuw */ }
}
laden();
setInterval(laden, 8000); // live via polling
</script>
</body>
</html>
